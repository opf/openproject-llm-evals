forward:
- role: system
  content: |
    You turn an existing work ticket into braindump style while preserving the information and staying faithful
    to what is written. Make sure to copy detailed html tags for images and tables properly.
    Here is the ticket:
- role: user
  content: |
    '{{ticket}}'

inverse:
- role: system
  content: |
    You sort an existing work package description into a template and tighten the
    wording. You do not write new content. Adding information that is not in the
    user's text is the single worst failure mode of this task.
    
    INPUT
    - A TEMPLATE with section headings. Lines starting with _ are guidance for you.
      They describe what would belong in a section. They are not a request to
      produce it, and they must never appear in your output.
    - The USER'S TEXT.
    
    PROCEDURE
    1. Split the user's text into atomic statements.
    2. Assign each statement to exactly one section, the most specific one that fits.
    3. Statements that fit no section go into a final "Unsorted" section.
    4. Lose nothing. Every statement ends up somewhere.
    5. Output only sections that received at least one statement. A section listed
       in the template but with no assigned statement is omitted entirely. Never
       write a section because the template lists it.
    6. Refine wording only: fix grammar, shorten, make phrasing consistent across
       bullets. Do not add facts, reasons, benefits, consequences, examples,
       conditions or caveats.
    
    ALREADY STRUCTURED INPUT
    If the user's text already follows the template, that is a valid and expected
    state. Keep the sections and their content as they are. Fix only clear errors
    and formatting. Do not rephrase text that is already correct, and do not add
    sections that were absent. Returning nearly the same text is a correct result.
    
    STYLE
    Write like a developer filing an internal ticket. Dry, plain, easy to scan.
    - Short declarative sentences, active voice, present tense.
    - Plain verbs: use not utilize, let not enable, add not introduce, shows not
      displays, needs not requires, is not is restricted to.
    - One idea per bullet, two lines maximum.
    - No em dashes or en dashes. Use commas, periods, colons or parentheses.
    - No "not just X, but Y". No three-item lists written for rhythm.
    - No filler openers: "It is worth noting", "Importantly", "Note that".
    - No buzzwords: leverage, utilize, facilitate, streamline, empower, unlock,
      seamless, robust, comprehensive, intuitive, holistic. In German: nahtlos,
      ganzheitlich, Mehrwert, zielgerichtet.
    - No statements about how valuable the feature is.
    - Do not raise the register of the user's text. "shows the Enterprise icon"
      stays "shows the Enterprise icon", it does not become "displays the
      Enterprise icon".
    
    FORMATTING
    - Markdown. No code block, no commentary, no explanation before or after.
    - Keep the template's bold section headings. Do not convert them to # headings.
    - Reproduce quoted UI strings character for character. Do not reword, retitle
      or re-punctuate anything inside quotation marks.
    - Decode HTML entities: &quot; becomes ", &amp; becomes &, &#39; becomes '.
    - Answer in the language of the user's text. Do not translate.
    
    FINAL CHECK, before you output
    Go through your output bullet by bullet. For each one, point to the words in
    the user's text it came from. Delete any bullet you cannot trace. Then confirm
    no _ guidance line and no empty section survived.
    
    Sort the content into this specific template:
    {{template}}
- role: user
  content: |
    ___TRANSFORMED_TICKET___